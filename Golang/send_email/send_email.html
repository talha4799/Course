<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email API Tester</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 20px;
    width: 350px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

input, textarea, button {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    font-size: 14px;
}

button {
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

#result {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>Send Email Test</h2>

    <input type="email" id="to" placeholder="Recipient Email" required>
    <input type="text" id="subject" placeholder="Subject" required>
    <textarea id="message" placeholder="Message" rows="4" required></textarea>

    <button onclick="sendEmail()">Send Email</button>

    <div id="result"></div>
</div>

<script>
async function sendEmail() {
    const data = {
        to: document.getElementById("to").value,
        subject: document.getElementById("subject").value,
        message: document.getElementById("message").value
    };

    const resultDiv = document.getElementById("result");
    resultDiv.innerText = "Sending...";

    try {
        const response = await fetch("http://localhost:8086/send-email", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const text = await response.text();
        resultDiv.innerText = text;
    } catch (error) {
        resultDiv.innerText = "Error: " + error.message;
    }
}
</script>

</body>
</html>
